name: Quality gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: make reusable-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # The support matrix in the README. 3.11 and 3.12 are required checks by name, so a new
        # version goes at the end and an existing one is never renamed (SPEC-009 RA-ENT-008).
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # A uv.lock that no longer matches pyproject.toml fails here, not at release, where the
      # SBOM's export refuses it (SPEC-009 RA-ENT-004).
      - name: Require an up-to-date uv.lock
        run: uv lock --check

      - name: Sync dev dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      # One step on purpose: `make reusable-check` is the gate a consumer's sync
      # preflight runs, so CI and the import contract cannot drift apart.
      - name: Canonical quality gate
        run: make reusable-check
        env:
          UV_PYTHON: ${{ matrix.python-version }}

  # A job of its own, not a matrix axis, so the required checks above keep their names.
  macos:
    name: make reusable-check (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dev dependencies
        run: uv sync --frozen --python 3.12

      - name: Canonical quality gate
        run: make reusable-check
        env:
          UV_PYTHON: "3.12"
