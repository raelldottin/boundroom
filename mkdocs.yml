site_name: repo-automation
site_description: Reusable supervised-slice automation distribution
site_url: https://raelldottin.github.io/repo-automation/
repo_url: https://github.com/raelldottin/repo-automation
repo_name: raelldottin/repo-automation
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Control Plane Specification: architecture/control-plane.md
  - Control Plane Inventory: architecture/control-plane-inventory.md
  - Kanban Projection Contract: architecture/kanban-projection.md
  - Kanban Write-back Contract: architecture/kanban-cutover.md
  - Agent-Agnostic Board Specification (proposed): architecture/agent-agnostic-board.md
  - Memory Interface Contract: architecture/memory-interface.md
  - Swarm Wiki Compiler Pin: architecture/swarm-wiki-compiler.md
  - Agent Plugin Specification: architecture/agent-plugin.md
  - Discord Knowledge Loop Specification: architecture/discord-knowledge-loop.md
  - Agentic SDLC and GitOps Standard (draft): architecture/agentic-gitops-sdlc-standard.md
  - Product Roadmap: product-roadmap.md
  - Technical Roadmap (October 2026): roadmap.md
  - CodSpeed Removal Roadmap: codspeed-removal.md
  - Workflow: workflows/repo-automation.md
  - Effectiveness Benchmark: workflows/effectiveness-benchmark.md

markdown_extensions:
  - admonition
  - codehilite
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
