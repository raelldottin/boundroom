name: Coverage

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    name: Tests + coverage comment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dev dependencies
        run: uv sync --frozen --python 3.12

      - name: Run tests with coverage
        run: |
          # fail_under in pyproject.toml fails this step below the floor.
          uv run --frozen pytest automation/tests \
            --cov=automation \
            --cov-report=xml \
            --cov-report=term-missing \
            --junit-xml=pytest.xml

      - name: Post coverage comment
        # Post even when the floor fails, so the PR shows the number that failed it.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: MishaKav/pytest-coverage-comment@9516bf7f32a9229cf18d5e1717ae387c7154f279 # v1.13.0
        with:
          pytest-xml-coverage-path: coverage.xml
          junitxml-path: pytest.xml
          title: Coverage report
          report-only-changed-files: true
