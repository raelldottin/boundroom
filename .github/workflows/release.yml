name: Release

# A maintainer pushes a semver tag (vMAJOR.MINOR.PATCH) on a commit already on main.
# This workflow refuses anything else, reruns the canonical gate, stages exactly the
# manifest's distributed tree with the consumer sync tool itself, writes an SBOM of uv.lock,
# attests the archive's build provenance and the SBOM, and publishes them.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap and first, so a malformed tag, or one the plugin manifests disagree with, is refused
  # before the gate matrix spends a run on it.
  semver:
    name: Refuse a malformed or mismatched tag
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require vMAJOR.MINOR.PATCH[-prerelease]
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $TAG is not semver (vMAJOR.MINOR.PATCH[-prerelease])"
            exit 1
          fi

      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # SPEC-002: every plugin manifest must exist and declare this tag's version.
      - name: Require the plugin manifests to match the tag
        env:
          TAG: ${{ github.ref_name }}
        run: python3 Tools/check_plugin_version.py "$TAG"
      # SPEC-009 RA-ENT-006: the release notes are the tag's CHANGELOG.md section.
      - name: Require a changelog section for the tag
        env:
          TAG: ${{ github.ref_name }}
        run: python3 Tools/changelog_section.py "$TAG" > /dev/null

  gate:
    name: make reusable-check
    needs: semver
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # The same matrix as lint.yml, so a release is never tested on less than a pull request.
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dev dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      # The same single step lint.yml runs, so a release can never pass a weaker gate.
      - name: Canonical quality gate
        run: make reusable-check
        env:
          UV_PYTHON: ${{ matrix.python-version }}

  gate-macos:
    name: make reusable-check (macOS)
    needs: semver
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dev dependencies
        run: uv sync --frozen --python 3.12

      - name: Canonical quality gate
        run: make reusable-check
        env:
          UV_PYTHON: "3.12"

  build:
    name: Stage manifest tree
    needs: [gate, gate-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Refuse a tag not on main
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::tag $TAG points at $commit, which is not reachable from origin/main"
            exit 1
          fi
          prerelease=false
          [[ "$TAG" == *-* ]] && prerelease=true
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dev dependencies
        run: uv sync --frozen --python 3.12

      # The consumer import path, with every protection on: pinned commit, origin
      # identity, clean source, quality gate (run again here, in the checkout being
      # packaged), runtime check. What lands in the staging directory is by construction
      # what a consumer's --sync at this commit writes into an empty target.
      - name: Stage the distributed tree
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ steps.tag.outputs.commit }}
          REMOTE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          origin="$(git remote get-url origin)"
          # Exact, because the sync tool's own --expect-remote check below is exact too.
          if [[ "$origin" != "$REMOTE" ]]; then
            echo "::error::checkout origin $origin is not $REMOTE"
            exit 1
          fi
          stage="$RUNNER_TEMP/boundroom-$TAG"
          Tools/boundroom-sync.sh --sync --target "$stage" \
            --pin "$COMMIT" --expect-remote "$REMOTE" --runtime-python .venv/bin/python

      - name: Build archive and checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          name="boundroom-$TAG"
          mtime="$(git log -1 --format=%ct HEAD)"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$mtime" \
            -C "$RUNNER_TEMP" -cf - "$name" | gzip -n > "dist/$name.tar.gz"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          tar -tzf "dist/$name.tar.gz"
          cat "dist/$name.tar.gz.sha256"

      # SPEC-009 RA-ENT-004: what installing Boundroom brings in, from this tag's uv.lock, as
      # CycloneDX. A release asset, signed itself and attested against the archive below.
      - name: Write the SBOM
        env:
          TAG: ${{ github.ref_name }}
        run: python3 Tools/release_sbom.py "dist/boundroom-$TAG.cdx.json" "$TAG"

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release
          path: dist/
          if-no-files-found: error

      # Kept apart from dist/, whose every file becomes a release asset and is attested.
      - name: Write release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p notes
          python3 Tools/changelog_section.py "$TAG" > notes/notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes
          path: notes/
          if-no-files-found: error

  # SPEC-009 RA-ENT-003: signed SLSA build provenance for the archive, verifiable with
  # `gh attestation verify`. A job of its own, so the OIDC token that signs it never reaches
  # a job that runs the gate or the dev dependencies. It only downloads what build staged.
  attest:
    name: Attest the archive
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release
          path: dist

      - name: Check the archive against its checksum
        working-directory: dist
        env:
          TAG: ${{ github.ref_name }}
        run: sha256sum --check --strict "boundroom-$TAG.tar.gz.sha256"

      # actions/attest is what attest-build-provenance wraps since v4, and what its README
      # recommends. With only subject-path it writes SLSA build provenance.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/boundroom-${{ github.ref_name }}.tar.gz
            dist/boundroom-${{ github.ref_name }}.cdx.json

      # The provenance above signs the SBOM file itself. This binds its content to the archive,
      # verifiable with `gh attestation verify --predicate-type https://cyclonedx.org/bom`.
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/boundroom-${{ github.ref_name }}.tar.gz
          sbom-path: dist/boundroom-${{ github.ref_name }}.cdx.json

  release:
    name: Publish GitHub release
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release
          path: dist

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-notes
          path: notes

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ needs.build.outputs.commit }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          {
            cat notes/notes.md
            echo
            echo "---"
            echo
            echo "Manifest-owned tree of $GITHUB_REPOSITORY at commit $COMMIT. Consumers sync from this tag; see docs/workflows/boundroom.md#releases."
            echo
            echo "Verify the archive: \`gh attestation verify boundroom-$TAG.tar.gz --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml\`"
            echo
            echo "The SBOM, \`boundroom-$TAG.cdx.json\`, lists what installing Boundroom brings in. Verify it the same way: \`gh attestation verify boundroom-$TAG.cdx.json --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml\`"
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${flags[@]}"
