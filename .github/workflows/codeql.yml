name: CodeQL

# SPEC-009 RA-ENT-005: static analysis of the Python code and of these workflows, reported as
# the repository's code-scanning alerts. It is not a required check; whether it becomes one is
# the owner's decision. Don't also turn on code scanning's default setup: GitHub refuses
# uploads from an advanced workflow like this one while default setup is on.

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Neither language is compiled, so CodeQL reads the source as it is.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
