[project]
name = "boundroom"
version = "0.4.0"
description = "Reusable supervised automation for bounded agent work."
license = "GPL-2.0-only"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.14.2",
]

[project.optional-dependencies]
# SPEC-006: imported only when telemetry is on. Not in the sync manifest's runtime dependencies,
# so a consumer without it still imports.
telemetry = [
    "logfire==5.4.0",
]

[dependency-groups]
dev = [
    "ruff==0.17.4",
    "ty==0.0.95",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "coverage==7.17.0",
    "mkdocs-material==9.8.0",
    "pip-audit==2.10.1",
    # So CI exercises the telemetry exporter; the same pin as the telemetry extra.
    "logfire==5.4.0",
]

[tool.uv]
# Tooling-and-tests project, not a distributable package; skip build/install.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["automation/tests"]
python_files = ["test_*.py"]
# Logfire, a dev dependency for the telemetry exporter, installs a pytest plugin that reads the
# environment on every test call; the knowledge tests count every environment read (SPEC-007 CP-1).
addopts = "-ra -p no:logfire"

[tool.coverage.run]
source = ["automation"]
branch = true
omit = [
    "automation/tests/*",
]

[tool.coverage.report]
show_missing = true
# Owner-approved floor; raise it only in a reviewed change.
fail_under = 88
skip_covered = false
precision = 1

[tool.ruff]
# Match the line length the codebase was written and previously linted against.
line-length = 130
target-version = "py311"

[tool.ruff.lint]
# Pinned to the rule set ruff defaulted to before 0.17, which widened its defaults and turned
# ~230 existing lines into findings (Dependabot #97). Adopting more rules is its own change.
select = ["E4", "E7", "E9", "F"]
# E402: the supervisor and context entrypoints intentionally insert the repo
# root on sys.path before importing first-party modules. This preserves the
# prior pylint `wrong-import-position` exemption.
ignore = ["E402"]

[tool.ty.environment]
python-version = "3.11"
